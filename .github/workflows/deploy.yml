name: Deploy frontend ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Siapkan Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pastikan VITE_API_URL terisi
        run: test -n "$VITE_API_URL" || (echo "Variabel VITE_API_URL belum diisi di Settings > Secrets and variables > Actions > Variables" && exit 1)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Pasang dependensi
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Siapkan Pages
        uses: actions/configure-pages@v6

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5